# Utter operator-host topology (SPEC §12, §17; RESOURCE-DEPLOY-DESIGN.md §3).
#
# This is the SIX-NETWORK operator-host stack (security review M6 + C1/C2,
# Rework 8). It is no longer a single flat dev net: the `internal: true` networks
# below are the ROUTING-LAYER egress deny that makes the long-lived service
# profile safe (an internal Docker network has no default gateway, so its members
# have no route to the internet at all, regardless of any in-container route).
# That routing-layer deny is the partner of the host nftables packet-layer deny
# (infrastructure/sandbox-host/nftables.rules.sh); neither alone is the boundary.
#
# gVisor (runsc) on the provisioned host remains THE untrusted-code isolation
# boundary (CLAUDE.md, SPEC §9.5). Plain Docker / Docker Desktop is NOT a security
# boundary. The internal:true egress-blocking property of these networks is only
# PROVABLE on the host: the live security acceptance is the PRX-02 blocked-host
# probe (createLiveHostProbe, infrastructure/RUNBOOK.md), not a local `up`.
#
# The `traefik:v3` image below is the REAL Traefik (a Go binary shipped as a
# Docker image). There is NO npm `traefik` dependency anywhere in this repo - the
# npm `traefik@1.0.0` package is an unrelated slopsquat and is deliberately absent.

services:
  # Edge reverse proxy: wildcard TLS termination + host routing. The ONLY
  # internet-facing service: it bridges `edge` (external, with the published
  # :443/:80 ports) to `ingress` (internal). It is never on controlplane /
  # proxynet / upstreamnet, so a Traefik compromise cannot reach the settle path
  # or the proxy's upstream credentials (design §4.3 residual risk 5).
  # Static config in ./traefik/traefik.yml; per-resource dynamic config is
  # generated by the deployer into ./traefik/dynamic/ (file provider).
  traefik:
    image: traefik:v3
    restart: unless-stopped
    networks: [edge, ingress]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
    environment:
      # DNS-01 provider credentials (operator-provisioned). EMPTY by default; the
      # real values live ONLY in .env.local (gitignored), passed via --env-file.
      - NAMECHEAP_API_USER=${NAMECHEAP_API_USER:-}
      - NAMECHEAP_API_KEY=${NAMECHEAP_API_KEY:-}

  # Response cache (DEP-03) + future deployment-record backing. M6: redis lives on
  # redisnet ONLY - a trusted backend net it shares with the data-proxy and nothing
  # else. It is NEVER on a resource-reachable net (proxynet/ingress/controlplane),
  # so a compromised handler/sidecar has no L3 path to it. The 6379 port is NOT
  # published to the host: redis is internal-only on the operator host; local dev
  # reads it via `docker exec <redis> redis-cli` (no host port needed).
  redis:
    image: redis:7
    restart: unless-stopped
    networks: [redisnet]
    # Readiness healthcheck so dependents can gate on redis being reachable, not merely
    # started. redis-cli ships in the redis:7 image (unlike node:slim, which has no
    # curl/wget), so a plain `redis-cli ping` is the cheap liveness probe here.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The allowlisted egress proxy (PRX-01/PRX-02) - the ONLY permitted egress from
  # a sandboxed resource. It joins proxynet (the handler's sole data-plane peer)
  # with a STATIC IP, upstreamnet (the only net where it reaches allowlisted
  # external upstreams), and redisnet (its quota/cache backend). It verifies the
  # scoped token, maps resource -> upstream credential server-side, forwards to
  # allowlisted upstreams. The static proxynet IP 172.30.0.10 is the data-proxy's
  # deterministic proxynet address (the handler's sole data-plane peer) and is the
  # address the future forward-path DOCKER-USER allow-rule will pin. It is NO
  # LONGER an argument to nftables.rules.sh: that host-output chain was descoped
  # to a policy-accept denylist that takes only UTTER_SANDBOX_HOST=1 + ARC_RPC_IP.
  data-proxy:
    build:
      context: ..
      dockerfile: packages/data-proxy/Dockerfile
    restart: unless-stopped
    networks:
      proxynet:
        ipv4_address: 172.30.0.10
      upstreamnet: {}
      redisnet: {}
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # HMAC secret for the scoped JWT. EMPTY here; real value in .env.local only.
      - DATA_PROXY_TOKEN_SECRET=${DATA_PROXY_TOKEN_SECRET:-}
      # Reaches redis over redisnet (Docker DNS resolves `redis` there; the proxy
      # runs under runc, not runsc, so embedded DNS works for it).
      - REDIS_URL=redis://redis:6379

  # The trusted settlement gate (PAY-09/PAY-10): the sidecar gate POSTs to
  # http://facilitator:8787/verify /settle /release over controlplane. The
  # facilitator joins controlplane (where the sidecar reaches it) + upstreamnet
  # (the only net where it reaches Arc RPC for the relayer pool / /settle) +
  # redisnet + backendnet (its durable backends: Redis for the reservation lock,
  # Postgres for the payments/results/revenue tables). It is internal-only (no
  # published host port); operators read health from `docker compose logs
  # facilitator`. Durability is OPT-IN: DATABASE_URL is empty and NODE_ENV is
  # unset by default, so the facilitator keeps its in-memory stores; the postgres
  # service is reachable on backendnet but only used once DATABASE_URL + production
  # are set. Resources are never on upstreamnet/redisnet/backendnet, so they
  # cannot reach Arc RPC, Redis, or Postgres directly (design §3(d)).
  facilitator:
    build:
      context: ..
      dockerfile: services/facilitator/Dockerfile
    restart: unless-stopped
    # Drain margin: SHUTDOWN_DRAIN_MS defaults to 10s, which equals Docker's default
    # stop grace, leaving zero headroom before SIGKILL. 15s gives the request drain
    # room to finish on a plain `docker stop` (compose enforces it; no -t 15 needed).
    stop_grace_period: 15s
    networks: [controlplane, upstreamnet, redisnet, backendnet]
    depends_on:
      postgres:
        condition: service_healthy
    # Compose-level readiness healthcheck (this block, NOT the image HEALTHCHECK, is what
    # `condition: service_healthy` reads). node:22-bookworm-slim has no curl/wget, so the
    # probe is `node -e` + the global fetch against GET /ready (store-aware): healthy only
    # when the durable backends are reachable. start_period covers the boot window.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      # Settlement relayer key(s). EMPTY here; real value in .env.local only, passed via --env-file.
      - RELAYER_SIGNER_KEYS=${RELAYER_SIGNER_KEYS:-}
      # Per-resource caller auth (C1/B9). Setting NODE_ENV=production REQUIRES
      # FACILITATOR_AUTH_SECRET (>=32 chars) AND a token-presenting caller. With
      # the Phase 2 sidecar landed, the sidecar mints + presents that token, so
      # production + the minted token are correct together (see RUNBOOK untrusted
      # sequence). Do NOT set production before the sidecar exists (it would 401).
      - FACILITATOR_AUTH_SECRET=${FACILITATOR_AUTH_SECRET:-}
      - NODE_ENV=${NODE_ENV:-}
      # Durable stores (PAY-09/PAY-11). EMPTY by default so the in-memory stores
      # stay the default; resolveFacilitatorStores arms the pg+redis adapters only
      # when NODE_ENV=production AND these URLs are set (and then fails closed if
      # they are absent). DATABASE_URL points at the in-compose postgres service;
      # REDIS_URL defaults to the in-compose redis on redisnet.
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Optional Arc RPC override; falls back to the chain default when blank.
      - ARC_RPC_URL=${ARC_RPC_URL:-}
      - PORT=8787

  # The trusted control-plane studio UI (HOST-STUDIO). A first-party platform
  # service, NOT the gVisor untrusted boundary. It joins ingress (Traefik routes
  # to it over the shared ingress net via dynamic/studio.yml), controlplane (where
  # it reaches the facilitator at facilitator:8787 for revenue reads), and
  # upstreamnet (the only net giving it internet egress for Arc RPC and an
  # optional model API). It is NEVER on edge, proxynet, or redisnet, so it cannot
  # weaken the resource-plane or money-path isolation, and it publishes no host
  # port (Traefik fronts it). It reaches the host deployer process via
  # host.docker.internal:8788; that deployer port must be firewalled off the
  # public internet on the host and is Bearer-authed by DEPLOYER_AUTH_SECRET
  # regardless. All secret-bearing env defaults to empty here; real values are
  # supplied via --env-file .env.local.
  studio:
    build:
      context: ..
      dockerfile: apps/studio/Dockerfile
    restart: unless-stopped
    networks: [ingress, controlplane, upstreamnet]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Gate studio startup on the facilitator + marketplace being READY (store-aware
    # service_healthy), not merely started, so the studio cannot accept a deploy before
    # those control-plane services can reach their durable backends. service_healthy
    # reads each service's compose healthcheck block above.
    depends_on:
      facilitator:
        condition: service_healthy
      marketplace:
        condition: service_healthy
    environment:
      # Production forces session.server.ts to require a >=32-char SESSION_SECRET.
      - NODE_ENV=production
      # Use the live data adapter (real reads through the StudioDataAdapter seam).
      - STUDIO_DATA_ADAPTER=live
      # Session cookie signing key. EMPTY here; real value in .env.local only.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Revenue reads cross controlplane to the facilitator service.
      - FACILITATOR_URL=http://facilitator:8787
      # The host deployer process, reached via the docker bridge host-gateway.
      - DEPLOYER_URL=${DEPLOYER_URL:-http://host.docker.internal:8788}
      # Bearer secret for POST /deploy. EMPTY here; real value in .env.local only.
      - DEPLOYER_AUTH_SECRET=${DEPLOYER_AUTH_SECRET:-}
      # The marketplace service the studio lists a deployed resource in (POST /resources).
      # Defaults to the in-compose marketplace service on the shared controlplane net, so
      # the discovery loop works with no operator config; an explicit env override still
      # wins (e.g. a non-compose marketplace host). EMPTY disables the marketplace listing.
      - MARKETPLACE_URL=${MARKETPLACE_URL:-http://marketplace:8789}
      # Shared Bearer for POST /resources. EMPTY here; real value in .env.local only. It
      # must match the marketplace service's own MARKETPLACE_AUTH_SECRET.
      - MARKETPLACE_AUTH_SECRET=${MARKETPLACE_AUTH_SECRET:-}
      # The deploy domain the agent-card URLs are built from.
      - DEPLOY_DOMAIN=${DEPLOY_DOMAIN:-}
      # SIWE anti-phishing domain bind. The browser signs a SiweMessage declaring the
      # host it is served from, and siwe.server.ts verifies against this value, so it
      # MUST equal the public studio host or every sign-in 401s (it otherwise falls back
      # to "localhost"). Defaults to the Traefik studio router host; override in
      # .env.local if the studio is hosted at a different domain.
      - SIWE_DOMAIN=${SIWE_DOMAIN:-app.utter.technology}
      # Optional Arc RPC override; falls back to the chain default when blank.
      - ARC_RPC_URL=${ARC_RPC_URL:-}
      - PORT=3000
      # Anthropic API key for live AI generation. EMPTY here; real value in
      # .env.local only. When set, selectGenerator returns the real ClaudeGenerator;
      # when absent the deterministic scaffold path is used (the load-bearing default).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Empty writable config dir so the Agent SDK uses ANTHROPIC_API_KEY, never a
      # stray interactive Claude Code OAuth token. Operator normally does not set it.
      - CLAUDE_CONFIG_DIR=${CLAUDE_CONFIG_DIR:-/tmp/utter-claude}
      # Model used for generation. Defaults to sonnet-5: the reliable + fast +
      # affordable balance for handler codegen. Override in .env.local to
      # claude-haiku-4-5-20251001 (cheapest) or claude-opus-4-8 (priciest/slowest,
      # over-reasons with no convergence gain on this task).
      - DEFAULT_MODEL=${DEFAULT_MODEL:-claude-sonnet-5}

  # The trusted agent-facing marketplace (A2A card + discovery API). A first-party
  # platform control-plane service, NOT the gVisor untrusted boundary. It joins
  # ingress (Traefik routes to it over the shared ingress net via
  # dynamic/marketplace.yml, so external agents can fetch deployed-resource cards +
  # /resources discovery), controlplane (where the studio reaches it at
  # marketplace:8789 to POST a deployed resource), and backendnet (its durable
  # Postgres backend for the resources/cards/moderation tables). It is Postgres-only
  # and does NOT read REDIS_URL, so it is NEVER on redisnet; it is also never on
  # edge, proxynet, or upstreamnet, so it cannot weaken the resource-plane or
  # money-path isolation, and it publishes no host port (Traefik fronts the public
  # surface; the studio reaches it on the internal controlplane net). Durability is
  # OPT-IN: DATABASE_URL is empty and NODE_ENV unset by default, so the in-memory
  # stores stay the default; the postgres service is reachable on backendnet but
  # only used once DATABASE_URL + production are set. Its publish endpoint is
  # Bearer-gated (fail-closed) so public Traefik exposure is safe; GET /resources
  # and the card route are intentionally public for agent discovery. All
  # secret-bearing env defaults to empty here; real values are supplied via
  # --env-file .env.local.
  marketplace:
    build:
      context: ..
      dockerfile: apps/marketplace/Dockerfile
    restart: unless-stopped
    # Drain margin: SHUTDOWN_DRAIN_MS defaults to 10s, which equals Docker's default
    # stop grace, leaving zero headroom before SIGKILL. 15s gives the request drain
    # room to finish on a plain `docker stop` (compose enforces it; no -t 15 needed).
    stop_grace_period: 15s
    networks: [ingress, controlplane, backendnet]
    depends_on:
      postgres:
        condition: service_healthy
    # Compose-level readiness healthcheck (this block, NOT the image HEALTHCHECK, is what
    # `condition: service_healthy` reads). node:22-bookworm-slim has no curl/wget, so the
    # probe is `node -e` + the global fetch against GET /ready (store-aware): healthy only
    # when the durable backend is reachable. start_period covers the boot window.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      # The marketplace HTTP port (server.ts default is 8789; set explicitly).
      - PORT=8789
      # Durable index/card/moderation store. EMPTY here; real value in .env.local
      # only. resolveMarketplaceStores fails closed in production without it.
      - DATABASE_URL=${DATABASE_URL:-}
      # The shared Bearer the studio presents to POST /resources. EMPTY here; real
      # value in .env.local only. It must match the studio's MARKETPLACE_AUTH_SECRET.
      - MARKETPLACE_AUTH_SECRET=${MARKETPLACE_AUTH_SECRET:-}
      - NODE_ENV=${NODE_ENV:-}
      # Publish-time verification probe (SCR-01): when set to the wildcard resources
      # host (e.g. resources.utter.technology), selectProber arms the LiveHttpsProber
      # (a no-pay card + 402 liveness/conformance probe against the deployed endpoint)
      # instead of the always-pass fixture. EMPTY here; real value in .env.local only.
      - SCORER_LIVE_HTTPS_HOST=${SCORER_LIVE_HTTPS_HOST:-}
      # ERC-8004 identity mint (operator-gated, resolveIdentity in live-deps.ts). The
      # real UPDATE-ONLY on-chain mint arms ONLY when all three reference registries
      # AND the registry-admin key are set (the registries must be deployed on Arc
      # first). EMPTY here; real values in .env.local only. The key is never logged.
      - ERC8004_IDENTITY_REGISTRY=${ERC8004_IDENTITY_REGISTRY:-}
      - ERC8004_REPUTATION_REGISTRY=${ERC8004_REPUTATION_REGISTRY:-}
      - ERC8004_VALIDATION_REGISTRY=${ERC8004_VALIDATION_REGISTRY:-}
      - REGISTRY_ADMIN_PRIVATE_KEY=${REGISTRY_ADMIN_PRIVATE_KEY:-}
      # Fail-closed in prod: with =1 the marketplace refuses to list with the placeholder
      # mint when the registries/key are unconfigured. Off by default (testnet unchanged).
      - IDENTITY_MINT_REQUIRED=${IDENTITY_MINT_REQUIRED:-}
      # Optional Arc RPC override for the mint + probe clients (defaults to the Arc
      # testnet RPC in @utter/chain when unset).
      - ARC_RPC_URL=${ARC_RPC_URL:-}

  # The durable Postgres backend (PAY-09/PAY-11, MKT-01/02). It lives on backendnet
  # ONLY (internal:true): a trusted backend net it shares with the facilitator and
  # marketplace and nothing else. It is NEVER on a resource-reachable net
  # (proxynet/ingress/upstreamnet), and the 5432 port is NOT published to the host,
  # so a compromised handler/sidecar has no L3 path to it; local dev reads it via
  # `docker exec <postgres> psql` (no host port needed). The schema is loaded ONCE
  # from ./db/schema.sql via /docker-entrypoint-initdb.d, and only when the pgdata
  # volume is EMPTY (postgres:16 runs init scripts on a fresh data dir only). To
  # re-apply a schema change the operator drops the pgdata volume. An empty
  # POSTGRES_PASSWORD with no POSTGRES_HOST_AUTH_METHOD makes postgres:16 fail
  # loudly at boot rather than silently opening a trust-auth database, so durability
  # is never accidentally armed without an operator-set password from .env.local.
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [backendnet]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-utter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-utter}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utter} -d ${POSTGRES_DB:-utter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Internal pull-through npm registry mirror (SBX-05). DEV-ONLY build tooling: it
  # stays OFF all six networks (it is on the compose default project net), so it is
  # unreachable from any resource container. The prod no-network-at-build property
  # holds ONLY on the operator-provisioned mirror; locally the build uses the
  # public registry with a documented REGISTRY_MIRROR_URL swap - do NOT claim
  # no-network-at-build until the mirror exists on the host. Keep 4873 for local.
  verdaccio:
    image: verdaccio/verdaccio:6
    restart: unless-stopped
    ports:
      - "4873:4873"

# The six operator-host networks (RESOURCE-DEPLOY-DESIGN.md §3). The dynamically
# launched per-resource containers are NOT declared here: the deployer attaches
# them BY NAME (services/deployer/src/orchestrate.ts PAIR_NETWORKS), so the bare
# `name:` values below MUST match that contract exactly.
#
#   - the untrusted HANDLER joins proxynet ONLY (no facilitator route, no internet;
#     its sole egress peer is the data-proxy at 172.30.0.10).
#   - the trusted SIDECAR joins ingress (Traefik routes to it) + controlplane (the
#     facilitator) + proxynet (the handler).
#   - NO resource container is EVER on edge, upstreamnet, or redisnet. That
#     membership rule is the M6 + C1/C2 containment: it is enforced by the deployer
#     and verified live by the PRX-02 blocked-host probe (createLiveHostProbe).
networks:
  edge:
    name: edge # external (internet egress); traefik only. Wildcard TLS terminates here.
  ingress:
    name: ingress
    internal: true # Traefik -> sidecar inbound only; no gateway -> not an egress path.
  controlplane:
    name: controlplane
    internal: true # sidecar -> facilitator; no internet.
  proxynet:
    name: proxynet
    internal: true # handler -> data-proxy data plane; no internet. Static-IP'd below.
    ipam:
      config:
        - subnet: 172.30.0.0/16
  upstreamnet:
    name: upstreamnet # external (internet); data-proxy upstreams + facilitator Arc RPC. No resources.
  redisnet:
    name: redisnet
    internal: true # redis backend, trusted services ONLY (redis + data-proxy).
  backendnet:
    name: backendnet
    internal: true # trusted pg backend: postgres + facilitator + marketplace only; no internet, not resource-reachable.

volumes:
  traefik-letsencrypt:
  pgdata:
