# Utter dev stack (SPEC §12, §17). NOT A SECURITY BOUNDARY.
#
# This compose file wires Traefik + Redis + the data-proxy + a Verdaccio mirror
# for LOCAL development and integration tests only. Plain Docker / Docker Desktop
# is NOT an untrusted-code isolation boundary (CLAUDE.md, SPEC §9.5): the only
# trusted isolation is gVisor (runsc) on the operator-provisioned host, and the
# live security acceptance (malicious-probe-blocked, live HTTPS 402->200,
# runsc-enforced limits) is operator-gated. Use this stack to wire and test the
# control plane, never to claim containment of adversarial code.
#
# The `traefik:v3` image below is the REAL Traefik (a Go binary shipped as a
# Docker image). There is NO npm `traefik` dependency anywhere in this repo — the
# npm `traefik@1.0.0` package is an unrelated slopsquat and is deliberately absent.

services:
  # Edge reverse proxy: wildcard TLS termination + host routing.
  # Static config in ./traefik/traefik.yml; per-resource dynamic config is
  # generated by the deployer into ./traefik/dynamic/ (file provider).
  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
    environment:
      # DNS-01 provider credentials (operator-provisioned). EMPTY by default; the
      # real values live ONLY in .env.local (gitignored), passed via --env-file.
      - NAMECHEAP_API_USER=${NAMECHEAP_API_USER:-}
      - NAMECHEAP_API_KEY=${NAMECHEAP_API_KEY:-}

  # Response cache (DEP-03) + future deployment-record backing. In-memory is the
  # TEST DEFAULT; this service is for local integration runs against real Redis.
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  # The allowlisted egress proxy (PRX-01/PRX-02) — the ONLY permitted egress from
  # a sandboxed resource. Verifies the scoped token, maps resource -> upstream
  # credential server-side, forwards to allowlisted upstreams.
  data-proxy:
    build:
      context: ..
      dockerfile: packages/data-proxy/Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # HMAC secret for the scoped JWT. EMPTY here; real value in .env.local only.
      - DATA_PROXY_TOKEN_SECRET=${DATA_PROXY_TOKEN_SECRET:-}
      - REDIS_URL=redis://redis:6379

  # Internal pull-through npm registry mirror (SBX-05). DEV-ONLY tooling here; the
  # prod no-network-at-build property holds ONLY on the operator-provisioned
  # mirror. Locally the build uses the public registry with a documented
  # REGISTRY_MIRROR_URL swap — do NOT claim no-network-at-build until the mirror
  # exists on the host.
  verdaccio:
    image: verdaccio/verdaccio:6
    restart: unless-stopped
    ports:
      - "4873:4873"

volumes:
  traefik-letsencrypt:
