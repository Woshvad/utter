# Traefik v3 STATIC config (SPEC §9.3; RESEARCH Code Ex §4).
# Source: doc.traefik.io ACME certificate-resolvers. Operator-provisioned.
#
# This is the static entrypoint + certResolver config. Per-resource routers are
# generated by the deployer into ./dynamic/<slug>.yml (the file provider below),
# so adding a resource never restarts Traefik.
#
# WILDCARD TLS REQUIRES DNS-01: Let's Encrypt refuses a wildcard via HTTP-01
# (RESEARCH Pitfall 5). The `le` resolver below uses dnsChallenge; the provider +
# its API credentials are operator-provisioned (DNS_PROVIDER / DNS_API_TOKEN in
# .env.local, never committed). The SAN must include both the apex and
# `*.resources.<domain>` (set per-router in the generated dynamic config).

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  # Per-resource dynamic config is written here by the deployer (atomic,
  # diffable, reconcilable — no Traefik restart needed).
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      # Operator's ops contact for the ACME account.
      email: ops@example.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        # Operator's DNS provider (e.g. cloudflare). API credentials are injected
        # via env (DNS_PROVIDER / DNS_API_TOKEN) and live ONLY in .env.local.
        provider: cloudflare

# No api/dashboard exposed by default (least surface). The operator enables it
# behind auth on the provisioned host if needed.
