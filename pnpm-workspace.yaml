packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "contracts"
# Native build scripts deliberately NOT run (set false, not "ask"). These are
# transitive helpers of dockerode (ssh2 -> cpu-features) and protobufjs,
# irrelevant to our Docker-over-socket usage; blocking their build scripts is the
# safe supply-chain posture and keeps the ERR_PNPM_IGNORED_BUILDS notice from
# failing verify gates.
allowBuilds:
  bufferutil: false
  cpu-features: false
  esbuild: false
  keccak: false
  protobufjs: false
  ssh2: false
  utf-8-validate: false

# Hold the single viem pin repo-wide (Pitfall 2 / T-06-VIEM). wagmi v2's peer is
# `viem: 2.x`, and @wagmi/connectors transitively resolves an older 2.23.2; this
# override forces every copy to the workspace 2.52.2 so `pnpm why viem` shows one
# version and type identity across @utter/* holds.
overrides:
  viem: 2.52.2
  # apps/docs' Mintlify CLI (mint) floats onto releases that pin a phantom
  # postcss@8.5.23 (never published; latest 8.5.x is real), which breaks a full
  # `pnpm install` on any host that resolves the docs tree fresh. Pin postcss to a
  # real 8.5.x so resolution succeeds. postcss 8.5.x is patch-compatible, so this is
  # safe for the only other consumer (apps/studio's Tailwind/PostCSS build).
  postcss: 8.5.16
