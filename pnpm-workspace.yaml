packages:
  - "apps/*"
  # apps/docs is a Mintlify-hosted docs site (built on Mintlify's own platform, not
  # here or in CI). Its `mint` CLI devDependency repeatedly floats onto releases that
  # pin npm versions which do not exist yet (postcss@8.5.23, @floating-ui/utils@^0.2.12),
  # breaking a full `pnpm install` for the WHOLE monorepo on any host that resolves the
  # docs tree fresh. Exclude it from the workspace so production/host installs never
  # resolve the docs tree and cannot be held hostage by a broken Mintlify release.
  # Author docs locally with `cd apps/docs && npx mint dev`.
  - "!apps/docs"
  - "services/*"
  - "packages/*"
  - "contracts"
# Native build scripts deliberately NOT run (set false, not "ask"). These are
# transitive helpers of dockerode (ssh2 -> cpu-features) and protobufjs,
# irrelevant to our Docker-over-socket usage; blocking their build scripts is the
# safe supply-chain posture and keeps the ERR_PNPM_IGNORED_BUILDS notice from
# failing verify gates.
allowBuilds:
  bufferutil: false
  cpu-features: false
  esbuild: false
  keccak: false
  protobufjs: false
  ssh2: false
  utf-8-validate: false

# Hold the single viem pin repo-wide (Pitfall 2 / T-06-VIEM). wagmi v2's peer is
# `viem: 2.x`, and @wagmi/connectors transitively resolves an older 2.23.2; this
# override forces every copy to the workspace 2.52.2 so `pnpm why viem` shows one
# version and type identity across @utter/* holds.
overrides:
  viem: 2.52.2
