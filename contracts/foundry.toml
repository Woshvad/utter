[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Arc Testnet supports cancun: an eth_call state-override probe on
# https://rpc.testnet.arc.network executed MCOPY (0x5e) successfully while a
# 0xfe INVALID control reverted (InvalidFEOpcode), confirming real opcode
# support. This resolves 01-RESEARCH Open Question 2 / assumption A1 (which
# precautionarily pinned paris). cancun is required because OpenZeppelin
# v5.6.1 EIP712 transitively compiles Bytes.sol (MCOPY) under solc 0.8.28.
evm_version = "cancun"
fuzz = { runs = 1000 }
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# ArcScan is a Blockscout instance, used by forge verify-contract with the
# blockscout verifier. Only the operator deploy plan consumes this block.
arc_testnet = { key = "", url = "https://testnet.arcscan.app/api/", chain = 5042002 }
