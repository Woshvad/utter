[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Pin paris for Arc Testnet compatibility. These contracts use no cancun
# features (no transient storage, no MCOPY), so paris is the safe target
# per 01-RESEARCH Open Question 2 / assumption A1.
evm_version = "paris"
fuzz = { runs = 1000 }
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
# ArcScan is a Blockscout instance, used by forge verify-contract with the
# blockscout verifier. Only the operator deploy plan consumes this block.
arc_testnet = { key = "", url = "https://testnet.arcscan.app/api/", chain = 5042002 }
